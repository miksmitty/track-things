<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Things</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<style>
  /* ---------- card / toolbar ---------- */
  .toolbar { display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .search { position:relative; flex:0 1 320px; }
  .search svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--faint); fill:none; stroke-width:2; stroke-linecap:round; pointer-events:none; }
  .search input { width:100%; font:inherit; padding:8px 12px 8px 34px; border:1px solid var(--line-strong); border-radius:10px; background:var(--bg2); color:inherit; outline:none; transition:.15s; }
  .search input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .count { color:var(--muted); font-size:12px; font-weight:600; background:var(--gray-soft); padding:4px 10px; border-radius:999px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 6px 4px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent-ink); }
  .chip b { font-weight:500; opacity:.8; }
  .chip button { border:none; background:none; padding:0 4px; color:inherit; font-size:13px; line-height:1; border-radius:50%; }
  .chip button:hover { background:var(--accent); color:#fff; }

  /* ---------- table ---------- */
  .scroll { overflow-x:auto; }
  table { border-collapse:separate; border-spacing:0; width:100%; table-layout:fixed; min-width:100%; }
  th, td { border-bottom:1px solid var(--line); padding:0; text-align:left; vertical-align:middle; }
  tbody > tr:last-child > td { border-bottom:none; }
  th.h { padding:5px 34px 5px 10px; cursor:pointer; user-select:none; white-space:nowrap; background:var(--head); backdrop-filter:blur(12px); font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:700; position:sticky; top:0; z-index:2; overflow:hidden; text-overflow:ellipsis; transition:color .15s; }
  th.h:hover { color:var(--text); }
  th.h.sorted { color:var(--accent-ink); }
  th.h .dd { position:absolute; right:10px; top:50%; transform:translateY(-50%); padding:2px 7px; border:none; background:none; color:var(--faint); font-size:11px; border-radius:6px; opacity:0; transition:.15s; }
  th.h:hover .dd, th.h .dd.on { opacity:1; }
  th.h .dd:hover { background:var(--accent-soft); color:var(--accent-ink); }
  th.h .dd.on { background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; }
  .rs { position:absolute; right:0; top:0; bottom:0; width:7px; cursor:col-resize; }
  .rs::after { content:""; position:absolute; right:3px; top:25%; bottom:25%; width:1px; background:var(--line-strong); }
  .rs:hover::after, body.resizing .rs::after { background:var(--accent); width:2px; }
  body.resizing { cursor:col-resize; user-select:none; }
  th.tog, td.tog { width:34px; text-align:center; }
  th.act, td.act { width:30px; text-align:center; }
  tbody > tr { transition:background .12s; }
  tbody > tr:hover > td:not(.subcell) { background:var(--hover); }
  tr.done > td:not(.subcell) > input:not([type=checkbox]) { color:var(--faint); }
  tr.done > td.strike > input { text-decoration:line-through; }

  td input:not([type=checkbox]) { width:100%; border:none; background:transparent; color:inherit; font:inherit; font-size:12.5px; padding:5px 10px; outline:none; border-radius:0; transition:.12s; }
  td input:focus { background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent); }
  td.num input { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:12px; font-variant-numeric:tabular-nums; }
  td.chk { text-align:center; }

  /* custom checkbox */
  input[type=checkbox] { appearance:none; -webkit-appearance:none; width:16px; height:16px; border-radius:5px; border:1.5px solid var(--line-strong); background:var(--panel-solid); cursor:pointer; display:inline-grid; place-items:center; vertical-align:middle; transition:.15s; margin:0; }
  input[type=checkbox]::before { content:""; width:8px; height:5px; border:2px solid #fff; border-top:none; border-right:none; transform:rotate(-45deg) scale(0); transition:transform .18s cubic-bezier(.2,.8,.2,1); margin-top:-2px; }
  input[type=checkbox]:hover { border-color:var(--accent); }
  input[type=checkbox]:checked { background:linear-gradient(135deg,var(--green),var(--teal)); border-color:transparent; box-shadow:0 4px 12px -4px var(--green); }
  input[type=checkbox]:checked::before { transform:rotate(-45deg) scale(1); }
  .vrow input[type=checkbox]:checked { background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:none; }

  /* status pills */
  td.pillcell { padding:3px 8px; }
  td.pillcell input { padding:2px 9px; border-radius:999px; font-weight:600; font-size:11.5px; width:auto; max-width:100%; background:var(--gray-soft); color:var(--gray); display:inline-flex; }
  td.pillcell input:focus { box-shadow:0 0 0 3px var(--accent-soft); background:var(--panel-solid); color:var(--text); }
  td.pillcell[data-tone=green] input { background:var(--green-soft); color:var(--green); }
  td.pillcell[data-tone=red] input { background:var(--red-soft); color:var(--red); }
  td.pillcell[data-tone=amber] input { background:var(--amber-soft); color:var(--amber); }
  td.pillcell[data-tone=blue] input { background:var(--blue-soft); color:var(--blue); }
  td.pillcell[data-tone=accent] input { background:var(--accent-soft); color:var(--accent-ink); }
  td.pillcell[data-tone=pink] input { background:var(--pink-soft); color:var(--pink); }
  td.pillcell[data-tone=teal] input { background:var(--teal-soft); color:var(--teal); }

  /* meeting minutes */
  th.note, td.note { width:30px; text-align:center; }
  td.note button { border:none; background:none; padding:3px 5px; border-radius:7px; color:var(--faint); cursor:pointer; display:inline-grid; place-items:center; }
  td.note button svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  td.note button:hover { background:var(--accent-soft); color:var(--accent-ink); }
  td.note button.has { color:var(--accent-ink); }
  td.note button.has svg { fill:var(--accent-soft); }
  dialog.minutes { width:min(860px,96vw); padding:0; overflow:hidden; }
  .mn-head { display:flex; align-items:center; gap:12px; padding:16px 22px 0; }
  .mn-head h2 { margin:0; font-size:17px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mn-head h2 small { color:var(--muted); font-weight:500; font-size:12px; margin-left:8px; }
  .mn-head .id { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11px; color:var(--faint); background:var(--gray-soft); padding:2px 8px; border-radius:6px; }
  .tabs { display:flex; gap:4px; padding:12px 22px 0; border-bottom:1px solid var(--line); }
  .tab { border:none; background:none; padding:8px 14px; border-radius:10px 10px 0 0; color:var(--muted); font-weight:600; font-size:13px; position:relative; }
  .tab.on { color:var(--accent-ink); }
  .tab.on::after { content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:2px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:2px; }
  .rt-toolbar { display:flex; flex-wrap:wrap; gap:2px; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--head); }
  .rt-toolbar button { border:none; background:none; padding:5px 8px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--muted); min-width:30px; }
  .rt-toolbar button:hover { background:var(--accent-soft); color:var(--accent-ink); }
  .rt-toolbar .sep { width:1px; background:var(--line-strong); margin:4px 6px; }
  .rt-body { height:min(60vh,520px); overflow:auto; }
  .rt, .rt-preview { padding:18px 24px; outline:none; min-height:100%; line-height:1.55; font-size:14px; }
  .rt:empty::before { content:attr(data-placeholder); color:var(--faint); pointer-events:none; }
  .rt h1, .rt-preview h1 { font-size:22px; margin:14px 0 8px; letter-spacing:-.02em; }
  .rt h2, .rt-preview h2 { font-size:17px; margin:14px 0 6px; }
  .rt h3, .rt-preview h3 { font-size:14px; margin:12px 0 4px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent-ink); }
  .rt p, .rt-preview p { margin:0 0 8px; }
  .rt ul, .rt ol, .rt-preview ul, .rt-preview ol { margin:0 0 8px; padding-left:24px; }
  .rt blockquote, .rt-preview blockquote { margin:8px 0; padding:6px 14px; border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 8px 8px 0; }
  .rt a, .rt-preview a { color:var(--accent-ink); }
  .rt table, .rt-preview table { border-collapse:collapse; margin:8px 0; }
  .rt td, .rt th, .rt-preview td, .rt-preview th { border:1px solid var(--line-strong); padding:4px 8px; }
  .rt code, .rt-preview code { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:12.5px; background:var(--gray-soft); padding:1px 5px; border-radius:5px; }
  .rt-preview.empty { color:var(--faint); font-style:italic; }
  .mn-foot { display:flex; align-items:center; gap:10px; padding:12px 22px 16px; border-top:1px solid var(--line); }
  .mn-foot .meta { flex:1; color:var(--muted); font-size:12px; }

  /* rule effects: a tinted row, a badge on a cell, or both */
  tr[data-tone=green] > td:not(.subcell) { background:var(--green-soft); } tr[data-tone=red] > td:not(.subcell) { background:var(--red-soft); } tr[data-tone=amber] > td:not(.subcell) { background:var(--amber-soft); } tr[data-tone=blue] > td:not(.subcell) { background:var(--blue-soft); } tr[data-tone=accent] > td:not(.subcell) { background:var(--accent-soft); } tr[data-tone=pink] > td:not(.subcell) { background:var(--pink-soft); } tr[data-tone=teal] > td:not(.subcell) { background:var(--teal-soft); } tr[data-tone=gray] > td:not(.subcell) { background:var(--gray-soft); }
  td.ruled { position:relative; }
  td.ruled > input:not([type=checkbox]) { padding-right:70px; }
  td.ruled .flag { position:absolute; right:28px; top:50%; transform:translateY(-50%); font-size:9px; font-weight:700; letter-spacing:.08em; padding:2px 6px; border-radius:6px; pointer-events:none; white-space:nowrap; }
  td.ruled.chk .flag, td.ruled.choice .flag, td.ruled.multi .flag { position:static; transform:none; margin-left:6px; }
  .flag[data-tone=green] { background:var(--green-soft); color:var(--green); } .flag[data-tone=red] { background:var(--red-soft); color:var(--red); } .flag[data-tone=amber] { background:var(--amber-soft); color:var(--amber); } .flag[data-tone=blue] { background:var(--blue-soft); color:var(--blue); } .flag[data-tone=accent] { background:var(--accent-soft); color:var(--accent-ink); } .flag[data-tone=pink] { background:var(--pink-soft); color:var(--pink); } .flag[data-tone=teal] { background:var(--teal-soft); color:var(--teal); } .flag[data-tone=gray] { background:var(--gray-soft); color:var(--gray); }
  td.ruled[data-tone=red] > input { color:var(--red); font-weight:600; } td.ruled[data-tone=amber] > input { color:var(--amber); font-weight:600; } td.ruled[data-tone=green] > input { color:var(--green); font-weight:600; } td.ruled[data-tone=blue] > input { color:var(--blue); font-weight:600; }
  /* rule editor (Configure dialog) */
  .rule { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; background:var(--bg2); }
  .rule .rhead { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .rule .rhead input { flex:1; font:inherit; font-weight:600; padding:6px 10px; border:1px solid var(--line-strong); border-radius:9px; background:var(--panel-solid); color:inherit; outline:none; }
  .rule .cond, .rule .eff { display:flex; align-items:center; gap:6px; margin:4px 0; flex-wrap:wrap; font-size:12.5px; }
  .rule .cond .kw, .rule .eff .kw { color:var(--muted); min-width:44px; text-align:right; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; }
  .rule select, .rule .cond input, .rule .eff input[type=text] { font:inherit; font-size:12.5px; padding:5px 8px; border:1px solid var(--line-strong); border-radius:8px; background:var(--panel-solid); color:inherit; outline:none; }
  .rule .cond input { width:120px; }
  .rule .x { border:none; background:none; color:var(--faint); padding:2px 6px; border-radius:6px; }
  .rule .x:hover { color:var(--red); background:var(--red-soft); }
  .rule .sw { gap:3px; } .rule .sw button { width:16px; height:16px; }
  .rule .sw button.none { background:transparent; border:1.5px dashed var(--line-strong); opacity:1; }
  .rule .eff label { display:flex; align-items:center; gap:5px; }

  /* avatars for owner-style text columns */
  .av { width:20px; height:20px; border-radius:50%; flex:none; display:grid; place-items:center; color:#fff; font-size:9px; font-weight:700; letter-spacing:.02em; box-shadow:0 2px 6px -2px rgba(0,0,0,.4), inset 0 0 0 1.5px rgba(255,255,255,.35); }
  td.personcell .add { color:var(--faint); font-size:11px; padding:1px 6px; border-radius:999px; border:1px dashed var(--line-strong); }
  td.personcell:hover .add { color:var(--accent-ink); border-color:var(--accent); }
  td.personcell.editing .who { box-shadow:inset 0 0 0 2px var(--accent); border-radius:8px; }
  .vrow .av { width:22px; height:22px; font-size:9.5px; }
  .pplrow { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .pplrow input[type=text], .pplrow input[type=email] { font:inherit; font-size:12.5px; padding:6px 10px; border:1px solid var(--line-strong); border-radius:9px; background:var(--bg2); color:inherit; outline:none; }
  .pplrow input:focus { border-color:var(--accent); }
  .pplrow .nm { flex:1; } .pplrow .ini { width:52px; text-align:center; font-family:"JetBrains Mono",ui-monospace,monospace; text-transform:uppercase; }
  .pplrow .av { width:26px; height:26px; font-size:10px; }

  /* choice columns */
  td.choice { padding:3px 8px; }
  td.choice select { font:inherit; font-size:11.5px; font-weight:600; padding:2px 22px 2px 9px; border:none; border-radius:999px; background:var(--gray-soft); color:var(--gray); outline:none; cursor:pointer; max-width:100%; appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%); background-position:calc(100% - 11px) 55%,calc(100% - 7px) 55%; background-size:4px 4px; background-repeat:no-repeat; }
  td.choice select:focus { box-shadow:0 0 0 3px var(--accent-soft); }
  td.choice select.blank { color:var(--faint); font-weight:500; }
  td.choice[data-tone=green] select { background-color:var(--green-soft); color:var(--green); }
  td.choice[data-tone=red] select { background-color:var(--red-soft); color:var(--red); }
  td.choice[data-tone=amber] select { background-color:var(--amber-soft); color:var(--amber); }
  td.choice[data-tone=blue] select { background-color:var(--blue-soft); color:var(--blue); }
  td.choice[data-tone=accent] select { background-color:var(--accent-soft); color:var(--accent-ink); }
  td.choice[data-tone=pink] select { background-color:var(--pink-soft); color:var(--pink); }
  td.choice[data-tone=teal] select { background-color:var(--teal-soft); color:var(--teal); }
  td.multi { padding:2px 8px; cursor:pointer; }
  td.multi .pills { display:flex; flex-wrap:wrap; gap:3px; align-items:center; min-height:20px; }
  td.multi .pill { font-size:11px; font-weight:600; padding:1px 8px; border-radius:999px; background:var(--gray-soft); color:var(--gray); white-space:nowrap; }
  td.multi .pill[data-tone=green] { background:var(--green-soft); color:var(--green); }
  td.multi .pill[data-tone=red] { background:var(--red-soft); color:var(--red); }
  td.multi .pill[data-tone=amber] { background:var(--amber-soft); color:var(--amber); }
  td.multi .pill[data-tone=blue] { background:var(--blue-soft); color:var(--blue); }
  td.multi .pill[data-tone=accent] { background:var(--accent-soft); color:var(--accent-ink); }
  td.multi .pill[data-tone=pink] { background:var(--pink-soft); color:var(--pink); }
  td.multi .pill[data-tone=teal] { background:var(--teal-soft); color:var(--teal); }
  td.multi .add { color:var(--faint); font-size:11px; padding:1px 6px; border-radius:999px; border:1px dashed var(--line-strong); }
  td.multi:hover .add { color:var(--accent-ink); border-color:var(--accent); }
  td.multi.editing .pills { box-shadow:inset 0 0 0 2px var(--accent); border-radius:8px; }
  .crow.opts { padding-left:22px; margin-top:-2px; }
  .optlist { padding-left:22px; margin:-2px 0 10px; display:flex; flex-direction:column; gap:6px; }
  .optrow { display:flex; align-items:center; gap:8px; }
  .optrow input[type=text] { flex:1; font:inherit; font-size:12.5px; padding:6px 10px; border:1px solid var(--line-strong); border-radius:9px; background:var(--bg2); color:inherit; outline:none; }
  .optrow input[type=text]:focus { border-color:var(--accent); }
  .optrow .drag { color:var(--faint); font-size:13px; width:12px; text-align:center; }
  .sw { display:flex; gap:4px; }
  .sw button { width:18px; height:18px; padding:0; border-radius:50%; border:2px solid transparent; background:var(--c); cursor:pointer; opacity:.55; transition:.12s; }
  .sw button:hover { opacity:1; transform:scale(1.15); }
  .sw button.on { opacity:1; border-color:var(--text); box-shadow:0 0 0 2px var(--panel-solid) inset; }
  .optrow .prev { font-size:11px; font-weight:600; padding:1px 8px; border-radius:999px; background:var(--gray-soft); color:var(--gray); min-width:60px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px; }
  .prev[data-tone=green] { background:var(--green-soft); color:var(--green); } .prev[data-tone=red] { background:var(--red-soft); color:var(--red); } .prev[data-tone=amber] { background:var(--amber-soft); color:var(--amber); } .prev[data-tone=blue] { background:var(--blue-soft); color:var(--blue); } .prev[data-tone=accent] { background:var(--accent-soft); color:var(--accent-ink); } .prev[data-tone=pink] { background:var(--pink-soft); color:var(--pink); } .prev[data-tone=teal] { background:var(--teal-soft); color:var(--teal); }
  .optrow .x { border:none; background:none; color:var(--faint); padding:2px 6px; border-radius:6px; }
  .optrow .x:hover { color:var(--red); background:var(--red-soft); }
  .crow.opts input { font-size:12.5px; }
  .crow.opts label { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); white-space:nowrap; }

  /* owner avatar */
  td.person { display:flex; align-items:center; gap:0; }
  td.person .av { width:20px; height:20px; border-radius:50%; flex:none; margin-left:8px; display:grid; place-items:center; color:#fff; font-size:9px; font-weight:700; letter-spacing:.02em; box-shadow:0 2px 6px -2px rgba(0,0,0,.4), inset 0 0 0 1.5px rgba(255,255,255,.35); }
  td.person input { padding-left:6px; }

  /* dates */
  td.datecell input { font-variant-numeric:tabular-nums; } td.datecell.overdue input, td.datecell.soon input { padding-right:76px; }
  td.datecell.overdue input { color:var(--red); font-weight:600; }
  td.datecell.soon input { color:var(--amber); font-weight:600; }
  td.datecell .flag { position:absolute; right:28px; top:50%; transform:translateY(-50%); font-size:9px; font-weight:700; letter-spacing:.08em; padding:2px 6px; border-radius:6px; pointer-events:none; }
  td.datecell { position:relative; }
  td.datecell.overdue .flag { background:var(--red-soft); color:var(--red); }
  td.datecell.soon .flag { background:var(--amber-soft); color:var(--amber); }

  /* expand toggle */
  .tip { position:fixed; z-index:50; background:var(--text); color:var(--bg); padding:7px 10px; border-radius:9px; font-size:12px; line-height:1.4; max-width:300px; white-space:pre-line; box-shadow:0 10px 30px -10px rgba(0,0,0,.5); pointer-events:none; opacity:0; transform:translateY(-3px); transition:opacity .12s, transform .12s; }
  .tip.on { opacity:1; transform:none; }
  .toggle { cursor:pointer; color:var(--muted); user-select:none; display:inline-flex; align-items:center; gap:4px; padding:2px 4px; border-radius:8px; font-size:11px; transition:.15s; }
  .toggle svg { width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; transition:transform .25s cubic-bezier(.2,.8,.2,1); }
  .toggle.open svg { transform:rotate(90deg); }
  .toggle:hover { background:var(--accent-soft); color:var(--accent-ink); }
  .toggle .n { background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border-radius:9px; padding:1px 7px; font-weight:700; font-size:10.5px; }
  td.idcell { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:10.5px; color:var(--faint); letter-spacing:.02em; cursor:copy; white-space:nowrap; }
  td.idcell:hover { color:var(--accent-ink); }
  th.idh { padding:5px 10px; font-size:10px; white-space:nowrap; background:var(--head); backdrop-filter:blur(12px); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); font-weight:700; }
  td.idcell { padding:0 10px; }
  td.subcell { background:var(--sub); padding:6px 10px 8px 40px; position:relative; }
  td.subcell td.subcell { padding-left:30px; }

  const chosen = new Set(ui.vals[c.key] || distinct);

  aggSel.value = c.agg || '';

  m.append(el('label', { className: 'aggrow' }, 'Total', aggSel), el('hr'));

    const row = (text, checked, onchange) => {
      const cb = el('input', { type: 'checkbox', checked, onchange: () => onchange(cb.checked) });

    list.append(row('(Select all)', vis.length > 0 && vis.every(v => chosen.has(v)), on => { vis.forEach(v => (on ? chosen.add(v) : chosen.delete(v))); drawList(); }));

  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = r.bottom + 4 + 'px';

// ---- KPI tiles: one per column that has a total configured (column menu → Total) ----

const ALLOWED_TAGS = new Set(['P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'H1', 'H2', 'H3', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'A', 'CODE', 'PRE', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH', 'HR', 'DIV', 'SPAN', 'SUB', 'SUP']);
// Keep only harmless markup: known tags, and href links that are not javascript:.
function sanitizeHtml(html) {
  const doc = new DOMParser().parseFromString('<body>' + (html || ''), 'text/html');
  const walk = node => {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 1) {
        if (!ALLOWED_TAGS.has(ch.tagName)) { ch.replaceWith(...ch.childNodes); walk(node); return; }
        [...ch.attributes].forEach(a => {
          const ok = a.name === 'href' && ch.tagName === 'A' && /^(https?:|mailto:|#|\/)/i.test(a.value.trim());
          if (!ok) ch.removeAttribute(a.name);
        });
        if (ch.tagName === 'A') { ch.setAttribute('target', '_blank'); ch.setAttribute('rel', 'noopener'); }
        walk(ch);
      } else if (ch.nodeType !== 3) ch.remove();
    });
  };
  walk(doc.body);
  return doc.body.innerHTML;
}

      name: (r.name || '').trim(),
      when: (r.when || []).filter(w => cols.some(c => c.key === w.col) && w.op).map(w => ({ col: w.col, op: w.op, ...(OP_NEEDS_VALUE.has(w.op) ? { value: w.value ?? '' } : {}) })),
      effect: { apply: r.effect && (r.effect.apply === 'row' || cols.some(c => c.key === r.effect.apply)) ? r.effect.apply : 'row', tone: r.effect && TONES.includes(r.effect.tone) ? r.effect.tone : '', label: (r.effect && r.effect.label || '').trim(), done: !!(r.effect && r.effect.done) },
    })).filter(r => r.when.length);
    const newLevels = draft.levels.map((lvl, i) => { const columns = finish(lvl.columns); return { title: titleInputs[i].value.trim() || (i ? 'Level ' + (i + 1) : 'Rows'), columns, rules: finishRules(lvl.rules, columns) }; })
      .filter((lvl, i) => i === 0 || lvl.columns.length);
    // Records deeper than the remaining levels are dropped.
    const prune = (rows, depth) => rows.forEach(r => { if (depth + 1 >= newLevels.length) delete r.children; else prune(r.children || [], depth + 1); });
    prune(state.rows, 0);
    if (renames.size) {   // a renamed person is renamed everywhere they are assigned
      const fix = v => Array.isArray(v) ? v.map(n => renames.get(n) || n) : (renames.get(v) || v);
      newLevels.forEach((lvl, d) => flattenLevel(state.rows, d).forEach(r => lvl.columns.forEach(c => { if (isPersonCol(c) && r[c.key] != null) r[c.key] = fix(r[c.key]); })));
    }
    state.config = { title: titleIn.value.trim() || 'Track Things', people: newPeople, levels: newLevels };
    save(); render();
  };
  dlg.className = '';
  dlg.replaceChildren(form);
  dlg.showModal();
}

fetch('/api/state').then(r => r.json()).then(s => { state = s; render(); });
</script>
</body>
</html>
