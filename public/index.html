<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Things</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<script src="shell.js"></script>
<style>
  /* ---------- card / toolbar ---------- */
  .toolbar { display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .search { position:relative; flex:0 1 320px; }
  .search svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--faint); fill:none; stroke-width:2; stroke-linecap:round; pointer-events:none; }
  .search input { width:100%; font:inherit; padding:8px 12px 8px 34px; border:1px solid var(--line-strong); border-radius:10px; background:var(--bg2); color:inherit; outline:none; transition:.15s; }
  .search input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .count { color:var(--muted); font-size:12px; font-weight:600; background:var(--gray-soft); padding:4px 10px; border-radius:999px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 6px 4px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent-ink); }
  .chip b { font-weight:500; opacity:.8; }
  .chip button { border:none; background:none; padding:0 4px; color:inherit; font-size:13px; line-height:1; border-radius:50%; }
  .chip button:hover { background:var(--accent); color:#fff; }
  /* toolbar buttons: Views and Columns */
  .tbtn { padding:5px 10px; font-size:12.5px; font-weight:600; gap:6px; color:var(--muted); background:transparent; border-color:transparent; white-space:nowrap; max-width:220px; }
  .tbtn:hover { background:var(--hover); color:var(--text); border-color:transparent; }
  .tbtn svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .tbtn .nm { overflow:hidden; text-overflow:ellipsis; }
  .tbtn.on { color:var(--accent-ink); background:var(--accent-soft); }
  .tbtn .dirty { width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none; }
  .tbtn .n { font-size:10.5px; font-weight:700; background:var(--gray-soft); padding:0 6px; border-radius:999px; }
  td.subcell .bar .tbtn { padding:3px 8px; font-size:12px; }
  .menu .mi.cur { color:var(--accent-ink); font-weight:600; }
  .menu .mi.cur::after { content:"✓"; float:right; }
  .menu .mi.danger:hover { background:var(--red-soft); color:var(--red); }
  .menu .mh { padding:6px 10px 2px; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
  .menu.cols .vrow { gap:8px; }
  .menu.cols .vrow .ty { margin-left:auto; font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; }
  /* dragging a column header to move it */
  th.h { cursor:grab; }
  th.h.dragging { opacity:.35; }
  th.h.drop-before { box-shadow:inset 3px 0 0 var(--accent); }
  th.h.drop-after { box-shadow:inset -3px 0 0 var(--accent); }
  body.coldrag, body.coldrag * { cursor:grabbing !important; user-select:none; }
  .colghost { position:fixed; z-index:60; pointer-events:none; padding:5px 10px; font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--accent-ink); background:var(--panel-solid); border:1px solid var(--accent); border-radius:8px; box-shadow:var(--shadow); transform:translate(-50%,-50%); }

  /* ---------- table ---------- */
  .scroll { overflow-x:auto; }
  table { border-collapse:separate; border-spacing:0; width:100%; table-layout:fixed; min-width:100%; }
  th, td { border-bottom:1px solid var(--line); padding:0; text-align:left; vertical-align:middle; }
  tbody > tr:last-child > td { border-bottom:none; }
  th.h { padding:5px 24px 5px 10px; cursor:pointer; user-select:none; white-space:nowrap; background:var(--head); backdrop-filter:blur(12px); font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:700; position:sticky; top:0; z-index:2; overflow:hidden; text-overflow:ellipsis; transition:color .15s; }
  th.h:hover { color:var(--text); }
  th.h.sorted { color:var(--accent-ink); }
  th.h .dd { position:absolute; right:6px; top:50%; transform:translateY(-50%); padding:2px 7px; border:none; background:none; color:var(--faint); font-size:11px; border-radius:6px; opacity:0; transition:.15s; }
  th.h:hover .dd, th.h .dd.on, th.h .dd:focus-visible { opacity:1; }
  th.h.c { text-align:center; padding-left:6px; padding-right:6px; }
  th.h.c .dd { right:2px; }
  th.h .dd:hover { background:var(--accent-soft); color:var(--accent-ink); }
  th.h .dd.on { background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; }
  .rs { position:absolute; right:0; top:0; bottom:0; width:7px; cursor:col-resize; }
  .rs::after { content:""; position:absolute; right:3px; top:25%; bottom:25%; width:1px; background:var(--line-strong); }
  .rs:hover::after, body.resizing .rs::after { background:var(--accent); width:2px; }
  body.resizing { cursor:col-resize; user-select:none; }
  th.tog, td.tog { width:40px; text-align:left; padding-left:2px; }
  th.act, td.act { width:30px; text-align:center; }
  th.sel, td.sel { width:26px; text-align:center; }
  th.sel { background:var(--head); position:sticky; top:0; z-index:2; }
  tbody > tr.selected > td:not(.subcell) { background:var(--accent-soft); }
  /* row multi-select bar */
  .selbar { display:none; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--accent-ink); }
  .selbar.on { display:flex; }
  .selbar button { padding:4px 10px; font-size:12px; }
  .selbar button.danger { border-color:var(--red); color:var(--red); }
  .selbar button.danger:hover { background:var(--red); color:#fff; }
  /* spreadsheet-style fill handle on the active cell: drag it down to copy the value */
  td.active { position:relative; box-shadow:inset 0 0 0 2px var(--accent); }
  td.active input:focus, td.active select:focus, td.active.editing .who, td.active.editing .pills { box-shadow:none; }   /* the cell ring replaces the inner control's own ring */
  td.active::after { content:""; position:absolute; right:-1px; bottom:-1px; width:9px; height:9px; background:var(--accent); border:1.5px solid var(--panel-solid); border-radius:2px; cursor:crosshair; z-index:3; }
  td.fillrange { box-shadow:inset 0 0 0 1.5px var(--accent); background:var(--accent-soft) !important; }
  body.filling, body.filling * { cursor:crosshair !important; user-select:none; }
  /* spreadsheet-style cells: a selected cell holds the focus itself; its text box takes the pointer and the caret only while it is being edited */
  td.cell { outline:none; scroll-margin:34px 12px 8px; }
  td.cell[data-kind=text] { cursor:cell; }
  td.cell input:not([type=checkbox]):not([type=date]) { pointer-events:none; }
  td.cell.typing { cursor:auto; }
  td.cell.typing input:not([type=checkbox]) { pointer-events:auto; }
  /* a block of selected cells (Shift + arrows, Shift-click or a drag): tinted around the active cell; the dashes mark what was last copied */
  td.cell.inrange:not(.active) { background:var(--accent-soft) !important; }
  td.cell.active.inrange::after { display:none; }   /* the fill handle belongs to a single cell */
  td.cell.copied { outline:1.5px dashed var(--accent); outline-offset:-2px; }
  tbody > tr { transition:background .12s; }
  tbody > tr:hover > td:not(.subcell) { background:var(--hover); }
  tr.done > td:not(.subcell) > input:not([type=checkbox]) { color:var(--faint); }
  tr.done > td.strike > input { text-decoration:line-through; }

  td input:not([type=checkbox]) { width:100%; border:none; background:transparent; color:inherit; font:inherit; font-size:12.5px; padding:5px 10px; outline:none; border-radius:0; transition:.12s; }
  td input:focus { background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent); }
  td.num input { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:12px; font-variant-numeric:tabular-nums; }
  td.chk { text-align:center; }

  /* ticks that are data (a yes / no column) are green; ticks that select things use the accent colour */
  td.chk input[type=checkbox]:checked { background:linear-gradient(135deg,var(--green),var(--teal)); box-shadow:0 4px 12px -4px var(--green); }

  /* status pills */
  td.pillcell { padding:3px 8px; }
  td.pillcell input { padding:2px 9px; border-radius:999px; font-weight:600; font-size:11.5px; width:auto; max-width:100%; background:var(--gray-soft); color:var(--gray); display:inline-flex; }
  td.pillcell input:focus { box-shadow:0 0 0 3px var(--accent-soft); background:var(--panel-solid); color:var(--text); }
  td.pillcell[data-tone=green] input { background:var(--green-soft); color:var(--green); }
  td.pillcell[data-tone=red] input { background:var(--red-soft); color:var(--red); }
  td.pillcell[data-tone=amber] input { background:var(--amber-soft); color:var(--amber); }
  td.pillcell[data-tone=blue] input { background:var(--blue-soft); color:var(--blue); }
  td.pillcell[data-tone=accent] input { background:var(--purple-soft); color:var(--purple); }
  td.pillcell[data-tone=pink] input { background:var(--pink-soft); color:var(--pink); }
  td.pillcell[data-tone=teal] input { background:var(--teal-soft); color:var(--teal); }

  /* notes (rich text per record; stored in the `minutes` field) */
  td.note { text-align:center; }
  td.note button { border:none; background:none; padding:3px 5px; border-radius:7px; color:var(--faint); cursor:pointer; display:inline-grid; place-items:center; }
  td.note button svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  td.note button:hover { background:var(--accent-soft); color:var(--accent-ink); }
  td.note button.has { color:var(--accent-ink); }
  td.note button.has svg { fill:var(--accent-soft); }
  dialog.minutes { width:min(860px,96vw); padding:0; overflow:hidden; }
  .mn-head { display:flex; align-items:center; gap:12px; padding:16px 22px 0; }
  .mn-head h2 { margin:0; font-size:17px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mn-head h2 small { color:var(--muted); font-weight:500; font-size:12px; margin-left:8px; }
  .mn-head .id { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11px; color:var(--faint); background:var(--gray-soft); padding:2px 8px; border-radius:6px; }
  .tabs { display:flex; gap:4px; padding:12px 22px 0; border-bottom:1px solid var(--line); }
  .tab { border:none; background:none; padding:8px 14px; border-radius:10px 10px 0 0; color:var(--muted); font-weight:600; font-size:13px; position:relative; }
  .tab.on { color:var(--accent-ink); }
  .tab.on::after { content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:2px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:2px; }
  .rt-toolbar { display:flex; flex-wrap:wrap; gap:2px; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--head); }
  .rt-toolbar button { border:none; background:none; padding:5px 8px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--muted); min-width:30px; }
  .rt-toolbar button:hover { background:var(--accent-soft); color:var(--accent-ink); }
  .rt-toolbar .sep { width:1px; background:var(--line-strong); margin:4px 6px; }
  .rt-body { height:min(60vh,520px); overflow:auto; }
  .rt, .rt-preview { padding:18px 24px; outline:none; min-height:100%; line-height:1.55; font-size:14px; }
  .rt:empty::before { content:attr(data-placeholder); color:var(--faint); pointer-events:none; }
  .rt h1, .rt-preview h1 { font-size:22px; margin:14px 0 8px; letter-spacing:-.02em; }
  .rt h2, .rt-preview h2 { font-size:17px; margin:14px 0 6px; }
  .rt h3, .rt-preview h3 { font-size:14px; margin:12px 0 4px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent-ink); }
  .rt p, .rt-preview p { margin:0 0 8px; }
  .rt ul, .rt ol, .rt-preview ul, .rt-preview ol { margin:0 0 8px; padding-left:24px; }
  .rt blockquote, .rt-preview blockquote { margin:8px 0; padding:6px 14px; border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 8px 8px 0; }
  .rt a, .rt-preview a { color:var(--accent-ink); }
  .rt table, .rt-preview table { border-collapse:collapse; margin:8px 0; }
  .rt td, .rt th, .rt-preview td, .rt-preview th { border:1px solid var(--line-strong); padding:4px 8px; }
  .rt code, .rt-preview code { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:12.5px; background:var(--gray-soft); padding:1px 5px; border-radius:5px; }
  .rt-preview.empty { color:var(--faint); font-style:italic; }
  .mn-foot { display:flex; align-items:center; gap:10px; padding:12px 22px 16px; border-top:1px solid var(--line); }
  .mn-foot .meta { flex:1; color:var(--muted); font-size:12px; }

  /* rule effects: a tinted row, a badge on a cell, or both */
  tr[data-tone=green] > td:not(.subcell) { background:var(--green-soft); } tr[data-tone=red] > td:not(.subcell) { background:var(--red-soft); } tr[data-tone=amber] > td:not(.subcell) { background:var(--amber-soft); } tr[data-tone=blue] > td:not(.subcell) { background:var(--blue-soft); } tr[data-tone=accent] > td:not(.subcell) { background:var(--purple-soft); } tr[data-tone=pink] > td:not(.subcell) { background:var(--pink-soft); } tr[data-tone=teal] > td:not(.subcell) { background:var(--teal-soft); } tr[data-tone=gray] > td:not(.subcell) { background:var(--gray-soft); }
  td.ruled { position:relative; }
  .fx { display:flex; align-items:center; min-width:0; }
  .fx > input:not([type=checkbox]) { flex:1; min-width:0; }
  td.chk .fx { justify-content:center; }
  td .flag { flex:none; font-size:8.5px; font-weight:700; letter-spacing:.06em; padding:2px 5px; border-radius:5px; white-space:nowrap; margin:0 4px 0 2px; }
  .fx > input[type=date] { padding-right:2px; font-weight:500 !important; letter-spacing:-.01em; }
  .fx > input[type=date]::-webkit-calendar-picker-indicator { margin-left:2px; }
  td:not(:hover) > .fx > input[type=date]:not(:focus)::-webkit-calendar-picker-indicator { display:none; }   /* room for the badge; the picker icon returns on hover */
  td.datecell.fmt .fx .flag { margin-right:30px; }
  .flag[data-tone=green] { background:var(--green-soft); color:var(--green); } .flag[data-tone=red] { background:var(--red-soft); color:var(--red); } .flag[data-tone=amber] { background:var(--amber-soft); color:var(--amber); } .flag[data-tone=blue] { background:var(--blue-soft); color:var(--blue); } .flag[data-tone=accent] { background:var(--purple-soft); color:var(--purple); } .flag[data-tone=pink] { background:var(--pink-soft); color:var(--pink); } .flag[data-tone=teal] { background:var(--teal-soft); color:var(--teal); } .flag[data-tone=gray] { background:var(--gray-soft); color:var(--gray); }
  td.ruled[data-tone=red] input { color:var(--red); font-weight:600; } td.ruled[data-tone=amber] input { color:var(--amber); font-weight:600; } td.ruled[data-tone=green] input { color:var(--green); font-weight:600; } td.ruled[data-tone=blue] input { color:var(--blue); font-weight:600; }
  /* Configure dialog: side navigation + one page at a time */
  dialog.config { width:min(980px,96vw); padding:0; overflow:hidden; }
  dialog.config form { display:flex; flex-direction:column; height:min(86vh,820px); }
  .cfghead { padding:20px 26px 14px; border-bottom:1px solid var(--line); }
  .cfgbody { flex:1; display:flex; min-height:0; }
  .cfgnav { width:220px; flex:none; border-right:1px solid var(--line); padding:12px 10px; display:flex; flex-direction:column; gap:2px; overflow:auto; background:var(--bg2); }
  .cfgnav .navitem { flex-direction:column; align-items:flex-start; gap:1px; padding:8px 12px; }
  .cfgnav .navitem small { font-size:11px; color:var(--faint); font-weight:500; }
  .cfgnav .navitem.active small { color:var(--accent-ink); opacity:.8; }
  .cfgnav .navlabel { padding:12px 12px 4px; }
  .cfgnav .navlabel:first-child { padding-top:4px; }
  .cfgnav .addlvl { margin-top:4px; color:var(--accent-ink); font-size:12.5px; border:1px dashed var(--line-strong); justify-content:center; align-items:center; }
  .cfgpane { flex:1; min-width:0; overflow:auto; padding:6px 26px 22px; }
  .cfgpane h3:first-child { margin-top:14px; }
  .cfgpane .crow.opts { margin-bottom:10px; }
  .fieldlab { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:0 0 6px; }
  .crow .ib { width:30px; height:30px; padding:0; border-color:transparent; background:none; color:var(--muted); font-size:14px; }
  .crow .ib:hover { background:var(--hover); color:var(--text); border-color:transparent; }
  .crow .ib.x:hover { background:var(--red-soft); color:var(--red); }
  .crow .ib:disabled { visibility:hidden; }
  .cfgpane .crow:not(.opts) > select { width:170px; flex:none; }
  .cfgpane .crow .grip { width:14px; font-size:11px; font-weight:700; }
  /* level page: record name beside the heading, then one compact row per column */
  .lvlhead { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .lvlhead h3 { margin-bottom:10px; }
  .recname { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; }
  .recname input { width:190px; font:inherit; font-size:13px; padding:6px 10px; border:1px solid var(--line-strong); border-radius:9px; background:var(--bg2); color:var(--text); outline:none; }
  .recname input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .colbar { display:flex; align-items:baseline; gap:10px; }
  .colbar .colcount { font-size:12px; color:var(--faint); }
  .cols { display:flex; flex-direction:column; gap:4px; }
  .colitem { position:relative; border-radius:10px; }
  .colitem.dragging { opacity:.35; }
  .colitem.dropbefore::before, .colitem.dropafter::after { content:""; position:absolute; left:20px; right:0; height:2px; border-radius:2px; background:var(--accent); }
  .colitem.dropbefore::before { top:-3px; } .colitem.dropafter::after { bottom:-3px; }
  .colrow { display:flex; align-items:center; gap:8px; }
  .colrow .grip { width:14px; flex:none; text-align:center; color:var(--faint); font-size:12px; letter-spacing:-3px; cursor:grab; user-select:none; }
  .colrow .grip:hover { color:var(--accent-ink); }
  .colrow input, .colrow select, .coldet select { font:inherit; font-size:13px; padding:7px 10px; border:1px solid var(--line-strong); border-radius:9px; background:var(--bg2); color:inherit; outline:none; transition:.15s; }
  .colrow input:focus, .colrow select:focus, .coldet select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .colrow > input { flex:0 1 210px; min-width:110px; }
  .colrow > select { width:146px; flex:none; }
  .colmid { flex:1; min-width:0; display:flex; align-items:center; gap:8px; }
  .colmid select { min-width:0; max-width:100%; }
  .colmid .dim { font-size:12px; color:var(--faint); white-space:nowrap; }
  .colrow .ib { width:28px; height:28px; flex:none; padding:0; border-color:transparent; background:none; color:var(--muted); font-size:13px; }
  .colrow .ib:hover { background:var(--hover); color:var(--text); border-color:transparent; }
  .colrow .ib.x:hover { background:var(--red-soft); color:var(--red); }
  .colrow .ib:disabled { visibility:hidden; }
  .pillsum { display:inline-flex; align-items:center; justify-content:flex-start; gap:5px; max-width:100%; min-width:0; overflow:hidden; padding:5px 9px; border:1px dashed var(--line-strong); border-radius:9px; background:transparent; font:inherit; font-size:12.5px; font-weight:500; color:var(--muted); white-space:nowrap; }
  .pillsum:hover, .pillsum.open { border-style:solid; border-color:var(--accent); color:var(--accent-ink); }
  .pillsum .prev { flex:none; font-size:11px; font-weight:600; padding:1px 8px; border-radius:999px; background:var(--gray-soft); color:var(--gray); }
  .pillsum .in { display:flex; align-items:center; gap:5px; min-width:0; overflow:hidden; }
  .pillsum .txt { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .pillsum .more { flex:none; }
  .pillsum .chev { flex:none; font-size:10px; color:var(--faint); margin-left:auto; padding-left:2px; }
  .coldet { margin:4px 0 8px 22px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--bg2); }
  .coldet .optlist { padding:0; margin:0; }
  .coldet .optrow input[type=text], .coldet select { background:var(--panel-solid); }
  .coldet .detrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); }
  .coldet .detrow + .detrow { margin-top:10px; }
  .coldet .detrow > .lab { width:118px; flex:none; }
  .coldet .detrow label { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .colactions { display:flex; gap:6px; margin-top:8px; }
  .cfgfoot { margin:0; padding:12px 26px; border-top:1px solid var(--line); background:var(--head); }
  details.optwrap, details.ruleswrap { margin:-2px 0 12px 22px; }
  details.ruleswrap { margin:18px 0 0; }

// Date columns store ISO yyyy-mm-dd; `format` only changes how a date is shown and typed.
const DATE_FORMATS = { native: 'Browser default (date picker)', dmy: '31/12/2026', mdy: '12/31/2026', ymd: '2026-12-31', dmmmy: '31 Dec 2026', long: '31 December 2026' };

const dateFormat = c => DATE_FORMATS[c.format] ? c.format : 'native';
function fmtDate(iso, fmt) {

  if (!m) return iso || '';
  const [, y, mo, d] = m, mon = MONTHS[Number(mo) - 1] || mo;
  switch (fmt) {
    case 'dmy': return d + '/' + mo + '/' + y;
    case 'mdy': return mo + '/' + d + '/' + y;
    case 'dmmmy': return Number(d) + ' ' + mon.slice(0, 3) + ' ' + y;

// Turn what someone typed back into ISO, or '' when it is not a date. Separators are lenient; 2-digit years mean 20xx.
function parseDate(text, fmt) {

function compare(a, b, type) {
  if (type === 'number') return (parseFloat(a) || 0) - (parseFloat(b) || 0);
  if (type === 'checkbox') return (a ? 1 : 0) - (b ? 1 : 0);
  if (Array.isArray(a) || Array.isArray(b)) { a = multiVals(a).join(', '); b = multiVals(b).join(', '); }
  return String(a ?? '').localeCompare(String(b ?? ''), undefined, { numeric: true });
}

const keysOf = (c, v) => { v = shown(c, v); return isMulti(c) ? (multiVals(v).length ? multiVals(v) : ['']) : [keyOf(c, v)]; };

function matches(row, cols, ui) {
  if (ui.search) {
    const q = ui.search.toLowerCase();
    if (!cols.some(c => (isMulti(c) ? multiVals(shown(c, row[c.key])).join(' ') : c.type === 'notes' ? plainText(row[c.key]) : String(shown(c, row[c.key]) ?? '')).toLowerCase().includes(q))) return false;
  }

    case 'notEmpty': return !empty;

// Click an avatar in the grid: choose its colour and initials without opening Configure.

  function cell(row, c, cols) {

      if (has) { nb.dataset.peek = '1'; nb._peek = () => ({ html: sanitizeHtml(row[c.key]), title: c.label + ' · ' + recordName(row, level) }); }

        row[c.key] = iso; save(); body();

        svg('M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z'), native);

  // Person cell: shows the avatar and name; click to pick from the people list, type to filter or add someone new.

  // Lookup cell: shows the chosen record(s) of the other data set; click to search that data set and pick.
  function lookupCell(row, c) {
    const multi = isMulti(c);
    const target = TT.setInfo(c.set);
    const td = el('td', { className: 'multi lookup', title: target ? 'Click to choose from ' + target.name : '' });
    const pills = el('div', { className: 'pills' });
    const ids = () => (multi ? multiVals(row[c.key]) : row[c.key] === '' || row[c.key] == null ? [] : [row[c.key]]).map(String);
    const paint = () => {
      pills.replaceChildren();
      if (!target && !ids().length) return pills.append(el('span', { className: 'unset', textContent: c.set ? 'Data set missing' : 'No data set chosen' }));
      ids().forEach(id => {
        const [first, ...rest] = lookupParts(c, id);
        const pill = el('span', { className: 'pill' + (target && target.byId.has(id) ? '' : ' missing') }, rest.length ? el('b', { textContent: first }) : first);
        if (rest.length) pill.append(el('span', { className: 'sub', textContent: rest.join(' · ') }));
        pill.dataset.tip = lookupLabel(c, id);

    td.append(pills);

      // Everything that can be picked, plus anything already chosen that is no longer in the other data set.
      const all = [...target.items.map(i => i.id), ...[...chosen].filter(id => !target.byId.has(id))].map(id => ({ id, parts: lookupParts(c, id), label: lookupLabel(c, id) }));
      const wide = all.some(i => i.parts.length > 1);
      const k1 = Math.min(18, Math.max(0, ...all.map(i => i.parts[0].length))) + 1;   // first field in an even column

        ? [el('span', { className: 'k1', textContent: i.parts[0], style: 'min-width:' + k1 + 'ch' }), el('span', { className: 'k2', textContent: i.parts.slice(1).join(' · ') })]
        : [el('span', { className: 'k1 only', textContent: i.parts[0] })];

      if (wide) m.style.width = '400px';

      const list = el('div', { className: 'vals' });
      let dirty = false, hi = 0;
      const pick = id => { row[c.key] = id; save(); closeMenu(); body(); };
      const drawList = () => {
        list.replaceChildren();
        const term = q.value.trim().toLowerCase();
        const vis = all.filter(i => i.label.toLowerCase().includes(term));
        hi = Math.max(0, Math.min(hi, vis.length - 1));

            cb.onchange = () => { cb.checked ? chosen.add(i.id) : chosen.delete(i.id); row[c.key] = all.map(x => x.id).filter(id => chosen.has(id)); save(); paint(); dirty = true; };
            list.append(el('label', { className: 'vrow' + (n === hi ? ' hi' : '') }, cb, ...fields(i)));
          } else {
            list.append(el('div', { className: 'vrow' + (n === hi ? ' hi' : ''), onclick: () => pick(i.id) }, ...fields(i), chosen.has(i.id) ? el('span', { className: 'tick', textContent: '✓' }) : ''));
          }

      };

        else if (e.key === 'ArrowUp') { hi--; drawList(); e.preventDefault(); }
        else if (e.key === 'Enter') { e.preventDefault(); const it = list.querySelectorAll('.vrow')[hi]; if (it) (it.querySelector('input') || it).click(); }

      if (multi) foot.append(el('button', { type: 'button', className: 'primary', textContent: 'Done', onclick: closeMenu }));
      m.append(q, list, foot);
      td.classList.add('editing');
      const obs = new MutationObserver(() => { if (!document.body.contains(m)) { td.classList.remove('editing'); obs.disconnect(); if (dirty) body(); } });
      obs.observe(document.body, { childList: true });
      document.body.append(m);
      placeMenu(m, td);
      q.focus();
    };
    return td;
  }

  function choiceCell(row, c) {

    if (!isMulti(c)) {

    td.append(pills);
    td.onclick = () => {

      });
      if (!all.length) list.append(el('div', { className: 'aggrow', textContent: 'No options yet. Add some in Configure columns.' }));
      m.append(list, el('div', { className: 'mbtns' }, el('button', { type: 'button', className: 'primary', textContent: 'Done', onclick: closeMenu })));
      td.classList.add('editing');
      const obs = new MutationObserver(() => { if (!document.body.contains(m)) { td.classList.remove('editing'); obs.disconnect(); if (dirty) body(); } });
      obs.observe(document.body, { childList: true });
      document.body.append(m);

  // ---- fill handle: drag the square in the corner of the active cell down the column to copy its value ----
  tbody._redraw = body;
  const ownTd = t => { const td = t && t.closest && t.closest('td'); return td && td._col && td.closest('tbody') === tbody ? td : null; };
  tbody.addEventListener('mousedown', e => {
    const td = ownTd(e.target);
    if (e.button || !td || td !== nav.td || nav.edit || nav.range) return;
    const r = td.getBoundingClientRect();
    if (r.right - e.clientX <= 12 && r.bottom - e.clientY <= 12) { e.preventDefault(); startFill(td); }
  });
  const cloneVal = v => Array.isArray(v) ? v.slice() : v;
  function startFill(src) {
    const c = src._col;
    const column = [...tbody.querySelectorAll('td')].filter(td => td._col === c && td.closest('tbody') === tbody);
    const i0 = column.indexOf(src);
    let range = [];
    const paint = i1 => {
      range.forEach(td => td.classList.remove('fillrange'));
      range = i1 == null ? [] : column.slice(Math.min(i0, i1), Math.max(i0, i1) + 1).filter(td => td !== src);
      range.forEach(td => td.classList.add('fillrange'));
    };
    const move = ev => {
      const over = document.elementFromPoint(ev.clientX, ev.clientY);
      const td = over && over.closest && over.closest('td');
      const i1 = td ? column.indexOf(td) : -1;
      if (i1 >= 0) paint(i1);
      else {   // pointer outside the column: snap to the nearest row vertically
        const y = ev.clientY;
        let best = -1, dist = Infinity;
        column.forEach((t, i) => { const r = t.getBoundingClientRect(); const d = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0; if (d < dist) { dist = d; best = i; } });
        paint(best);
      }

      removeEventListener('mousemove', move); removeEventListener('mouseup', up);
      document.body.classList.remove('filling');
      if (range.length) {
        const v = src._row[c.key];
        range.forEach(td => { td._row[c.key] = cloneVal(v); });
        save();
      }
      paint(null);
      body();
    };
    document.body.classList.add('filling');
    addEventListener('mousemove', move);
    addEventListener('mouseup', up);
  }

  body();
  const addRow = () => {
    const r = { id: uid() };
    allCols.forEach(c => (r[c.key] = c.type === 'checkbox' ? false : isMulti(c) ? [] : ''));
    if (opts.subGrid) r.children = [];
    rows.push(r); save();
    opts.onStructure ? opts.onStructure() : body();
    const f = document.querySelector('tr[data-rid="' + r.id + '"] input:not([type=checkbox]), tr[data-rid="' + r.id + '"] select');

const ICONS = { count: 'M4 12.5l5 5L20 6.5', distinct: 'M8 8h13M8 12h13M8 16h13M3 8h.01M3 12h.01M3 16h.01', sum: 'M18 4H6l7 8-7 8h12', avg: 'M3 17l6-6 4 4 8-8M21 7v4h-4', min: 'M12 5v14m0 0l-5-5m5 5l5-5', max: 'M12 19V5m0 0l-5 5m5-5l5 5', date: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z' };

function renderKpis() {

    t.append(el('div', { className: 'ico' }, svg(icon)), el('div', {}, el('div', { className: 'v', textContent: value }), el('div', { className: 'l', textContent: label })));
    if (pct != null) t.append(ring(pct, color));

  };
  // Breakdown cards. Values are the same keys the column filter uses, so clicking one on a top-level column
  // filters the grid by it (again to clear; ⌘/Ctrl-click to add or remove from the selection).
  const filterBy = (item, c, o, text) => {
    const active = uiMain.vals[c.key];
    item.type = 'button';
    item.classList.toggle('on', !!(active && active.has(o)));
    const only = active && active.size === 1 && active.has(o);
    item.dataset.tip = (only ? 'Clear filter' : 'Show only ' + c.label + ': ' + text) + '\n' + (navigator.platform.includes('Mac') ? '⌘' : 'Ctrl') + '-click to add or remove from the selection';
    item.onclick = e => {
      let set;
      if (e.ctrlKey || e.metaKey) {                       // add to / remove from the current selection
        set = uiMain.vals[c.key] || new Set();
        set.has(o) ? set.delete(o) : set.add(o);
      } else set = only ? new Set() : new Set([o]);       // plain click: just this one (again to clear)
      if (set.size) uiMain.vals[c.key] = set; else delete uiMain.vals[c.key];
      render();

  };
  const countKeys = (c, list) => {
    const all = list.flatMap(r => keysOf(c, r[c.key]));

    const blanks = counts[''] || 0;
    delete counts[''];

  };
  // A counted choice column: the total on top, a stacked bar, then one pill per option with its count.
  const breakdown = (c, list, label, total, color, depth) => {
    const { counts } = countKeys(c, list);
    const names = [...new Set([...(c.options || []), ...Object.keys(counts)])];
    const t = tile(label, total, color, ICONS.count);
    t.classList.add('split');
    const stack = el('div', { className: 'stack' });
    names.filter(o => counts[o]).forEach(o => {

        el('b', { className: 'pc', textContent: n }), el('span', { className: 'pp', textContent: Math.round(n / (entries || 1) * 100) + '%' }));

    names.forEach(o => line(o, counts[o], show(o)));
    if (blanks) line('', blanks, '(Blank)');
    if (extra.length) rowsBox.append(el('div', { className: 'pmore', textContent: '+ ' + extra.length + ' more ' + (extra.length === 1 ? 'value' : 'values') + ' in ' + extra.reduce((n, o) => n + counts[o], 0) + ' rows' }));

}

          const after = item.classList.contains('dropafter');
          const [moved] = list.splice(dragFrom, 1);
          list.splice(i - (dragFrom < i ? 1 : 0) + (after ? 1 : 0), 0, moved);
          dragFrom = -1; draw();
        };

        const name = el('input', { value: c.label, placeholder: 'Column name' });
        name.oninput = () => (c.label = name.value);
        name.onkeydown = e => {   // Alt + arrow moves the column and keeps the cursor in it
          const to = e.altKey && e.key === 'ArrowUp' ? i - 1 : e.altKey && e.key === 'ArrowDown' ? i + 1 : -1;
          if (to < 0 || to >= list.length) return;
          e.preventDefault();
          [list[to], list[i]] = [list[i], list[to]];
          draw();
          box.querySelectorAll('.colrow > input')[to]?.focus();
        };
        const type = el('select');
        TYPES.forEach(t => type.append(el('option', { value: t, textContent: TYPE_LABELS[t], selected: t === c.type })));
        type.onchange = () => { c.type = type.value; c._open = c.type === 'choice' || c.type === 'lookup'; draw(); };
        const del = el('button', { type: 'button', className: 'ib x', textContent: '✕', onclick: () => { list.splice(i, 1); draw(); } });
        del.dataset.tip = 'Remove column';

        const mid = el('div', { className: 'colmid' });
        const summary = (paint) => {   // a button that sums up the setting and opens its editor beneath the row
          const b = el('button', { type: 'button', className: 'pillsum' + (c._open ? ' open' : ''), onclick: () => { c._open = !c._open; draw(); } });
          const repaint = () => { const inner = el('span', { className: 'in' }); paint(inner, b); b.replaceChildren(inner, el('span', { className: 'chev', textContent: c._open ? '▴' : '▾' })); };
          repaint();
          mid.append(b);
          return repaint;
        };
        let detail = null;
        if (c.type === 'text') {
          const look = el('select');
          [['plain', 'Plain text'], ['status', 'Status pill (coloured by value)']].forEach(([v, t]) => look.append(el('option', { value: v, textContent: t, selected: c.look === v })));
          look.onchange = () => (c.look = look.value);
          mid.append(small('Show as'), look);
        }
        if (c.type === 'date') {
          const fmtSel = el('select');
          Object.entries(DATE_FORMATS).forEach(([v, t]) => fmtSel.append(el('option', { value: v, textContent: t, selected: dateFormat(c) === v })));
          fmtSel.onchange = () => (c.format = fmtSel.value);
          mid.append(small('Format'), fmtSel);
        }
        if (c.type === 'choice') {
          c.options = c.options || []; c.colors = c.colors || {};
          const paintSum = summary((b, btn) => {
            const opts = c.options.filter(Boolean);
            opts.slice(0, 4).forEach(o => { const p = el('span', { className: 'prev', textContent: o }); p.dataset.tone = optionTone(c, o); b.append(p); });
            const more = (opts.length > 4 ? '+' + (opts.length - 4) : '') + (opts.length ? '' : 'Add choices') + (c.multi ? ' · multiple' : '');
            if (more) b.append(el('span', { className: 'more', textContent: more }));
            btn.dataset.tip = opts.length ? opts.join(', ') + (c.multi ? '\n(multiple allowed)' : '') : 'No choices yet';
          });
          if (c._open) {
            const olist = el('div', { className: 'optlist' });
            const drawOpts = () => {
              olist.replaceChildren();
              c.options.forEach((o, k) => {
                const oname = el('input', { type: 'text', value: o, placeholder: 'Choice' });
                const prev = el('span', { className: 'prev', textContent: o || 'Choice' });
                const paint = () => { prev.dataset.tone = optionTone(c, c.options[k]); prev.textContent = c.options[k] || 'Choice'; sw.paint(); paintSum(); };
                const sw = swatches(() => c.colors[c.options[k]], t => { if (!c.options[k]) return; if (t) c.colors[c.options[k]] = t; else delete c.colors[c.options[k]]; paint(); }, { none: 'Automatic colour' });
                oname.oninput = () => { const old = c.options[k]; c.options[k] = oname.value.trim(); if (c.colors[old] && old !== c.options[k]) { c.colors[c.options[k]] = c.colors[old]; delete c.colors[old]; } paint(); };
                oname.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); c.options.splice(k + 1, 0, ''); drawOpts(); olist.querySelectorAll('.optrow input[type=text]')[k + 1]?.focus(); } };
                const odel = el('button', { type: 'button', className: 'x', textContent: '✕', title: 'Remove this choice', onclick: () => { delete c.colors[c.options[k]]; c.options.splice(k, 1); drawOpts(); paintSum(); } });
                paint();
                olist.append(el('div', { className: 'optrow' }, oname, prev, sw, odel));
              });
              const add = el('button', { type: 'button', className: 'ghost', textContent: '+ Add choice', onclick: () => { c.options.push(''); drawOpts(); [...olist.querySelectorAll('.optrow input[type=text]')].pop()?.focus(); } });
              const multi = el('input', { type: 'checkbox', checked: !!c.multi });
              multi.onchange = () => { c.multi = multi.checked; paintSum(); };
              olist.append(el('div', { className: 'optrow' }, add, el('span', { style: 'flex:1' }), el('label', { className: 'check', style: 'display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)' }, multi, 'Allow multiple')));
            };
            drawOpts();
            detail = el('div', { className: 'coldet' }, olist);
          }
        }
        if (c.type === 'lookup') {
          const others = TT.sets().filter(x => x.id !== TT.set);
          const paintSum = summary((b, btn) => {
            const t = TT.setInfo(c.set);
            const shownCols = t ? (c.show || []).map(k => t.columns.find(x => x.key === k)).filter(Boolean).map(x => x.label) : [];
            const text = !t ? (c.set ? 'Data set missing' : others.length ? 'Choose a data set' : 'No other data sets yet')
              : '→ ' + t.name + (shownCols.length ? ' · shows ' + shownCols.join(', ') : '') + (c.multi ? ' · multiple' : '');
            b.append(el('span', { className: 'txt', textContent: text }));
            btn.dataset.tip = text;
          });
          if (c._open) {
            const pick = el('select');
            pick.append(el('option', { value: '', textContent: others.length ? 'Choose a data set…' : 'No other data sets yet' }));
            others.forEach(x => pick.append(el('option', { value: x.id, textContent: x.name + ' (' + plural(x.rows, 'row') + ')' })));
            if (c.set && !others.some(x => x.id === c.set)) pick.append(el('option', { value: c.set, textContent: c.set + ' (missing)' }));
            pick.value = c.set || '';
            // Which of the other data set's fields the cell and its picker show, in the order they are ticked.
            const chips = el('div', { className: 'showchips' });
            const drawChips = () => {
              const t = TT.setInfo(c.set);
              c.show = (c.show || []).filter(k => t && t.columns.some(x => x.key === k));
              chips.replaceChildren();
              if (!t) return chips.append(el('span', { className: 'hint', textContent: 'Choose a data set first.' }));
              t.columns.forEach(x => {
                const at = c.show.indexOf(x.key);
                const b = el('button', { type: 'button', className: at >= 0 ? 'on' : '', onclick: () => { at >= 0 ? c.show.splice(at, 1) : c.show.push(x.key); drawChips(); paintSum(); } });
                if (at >= 0) b.append(el('i', { textContent: at + 1 }));
                b.append(x.label);
                chips.append(b);
              });
              const first = t.columns.find(x => x.type === 'text') || t.columns[0];
              if (!c.show.length) chips.append(el('span', { className: 'hint', textContent: first ? 'None ticked: shows ' + first.label + '.' : 'That data set has no columns yet.' }));
            };
            pick.onchange = () => { c.set = pick.value; c.show = []; drawChips(); paintSum(); };
            const multi = el('input', { type: 'checkbox', checked: !!c.multi });
            multi.onchange = () => { c.multi = multi.checked; paintSum(); };
            drawChips();
            detail = el('div', { className: 'coldet' },
              el('div', { className: 'detrow' }, el('span', { className: 'lab', textContent: 'Looks up a row in' }), pick, el('label', {}, multi, 'Allow multiple')),
              el('div', { className: 'detrow' }, el('span', { className: 'lab', textContent: 'Show' }), chips));
            if (!others.length) detail.append(el('p', { className: 'sub', style: 'margin-top:10px', textContent: 'Create another data set with “New data set” in the sidebar, then point this column at it.' }));
          }
        }
        item.append(el('div', { className: 'colrow' }, grip, name, type, mid, del));
        if (detail) item.append(detail);
        box.append(item);
      });
    };
    draw();
    const add = el('button', { type: 'button', className: 'ghost', textContent: '+ Add column', onclick: () => { list.push({ key: '', label: '', type: 'text' }); draw(); [...box.querySelectorAll('.colrow > input')].pop()?.focus(); } });
    const fromCsv = el('button', { type: 'button', className: 'ghost', textContent: 'Add columns from a CSV file…', onclick: async () => {
      const cols = await TT.pickCsvColumns(list.map(c => c.key).filter(Boolean));
      if (!cols) return;
      cols.forEach(c => list.push({ ...c, key: '' }));   // keys are assigned on save, like any new column
      draw();
    } });
    return [
      el('div', { className: 'lvlhead' }, el('h3', { textContent: heading }), ...(titleInput ? [el('label', { className: 'recname' }, 'One record is called', titleInput)] : [])),
      el('div', { className: 'colbar' }, el('h3', { textContent: 'Columns', style: 'margin-top:8px' }), count),
      box, el('div', { className: 'colactions' }, add, fromCsv)];
  };

  // Rules editor for one level: each rule is "when all of these hold → do this".
  function rulesEditor(lvl) {
    lvl.rules = lvl.rules || [];
    const box = el('div');
    const colsOf = () => lvl.columns.filter(c => c.label.trim()).map(c => ({ key: c.key || c.label.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_'), label: c.label.trim(), type: c.type }));
    const draw = () => {
      box.replaceChildren();
      lvl.rules.forEach((rule, ri) => {
        rule.when = rule.when || []; rule.effect = rule.effect || { apply: 'row', tone: '' };
        const card = el('div', { className: 'rule' });
        const name = el('input', { value: rule.name || '', placeholder: 'Rule name (e.g. Overdue)' });
        name.oninput = () => (rule.name = name.value);
        card.append(el('div', { className: 'rhead' }, name, el('button', { type: 'button', className: 'x', textContent: '✕', title: 'Delete rule', onclick: () => { lvl.rules.splice(ri, 1); draw(); } })));
        const cols = colsOf();
        rule.when.forEach((w, wi) => {
          const colSel = el('select');
          cols.forEach(c => colSel.append(el('option', { value: c.key, textContent: c.label, selected: c.key === w.col })));
          if (!cols.some(c => c.key === w.col) && cols[0]) w.col = cols[0].key;
          const opSel = el('select');
          const val = el('input', { value: w.value ?? '', placeholder: 'value' });
          const pickVal = el('select');   // used instead of the text box when the column has a fixed list of values
          const fillOps = () => {
            const c = cols.find(x => x.key === colSel.value) || cols[0];
            opSel.replaceChildren();
            (OPS[c ? c.type : 'text'] || OPS.text).forEach(([v, t]) => opSel.append(el('option', { value: v, textContent: t, selected: v === w.op })));
            if (![...opSel.options].some(o => o.value === w.op)) { w.op = opSel.options[0].value; opSel.value = w.op; }
            const needs = OP_NEEDS_VALUE.has(w.op);
            const full = c && lvl.columns.find(x => (x.key || x.label.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_')) === c.key);
            const list = !c ? null : c.type === 'choice' ? (full && full.options || []).filter(Boolean) : c.type === 'person' ? draft.people.map(p => p.name.trim()).filter(Boolean) : c.type === 'lookup' ? ((TT.setInfo(full && full.set) || { items: [] }).items.map(i => lookupLabel(full, i.id))) : null;
            if (needs && list && ['is', 'isNot'].includes(w.op)) {
              pickVal.replaceChildren(el('option', { value: '', textContent: 'Choose…', disabled: true }));
              const cur = String(w.value ?? '');
              if (cur && !list.some(o => o.toLowerCase() === cur.toLowerCase())) pickVal.append(el('option', { value: cur, textContent: cur + ' (not a current value)' }));
              list.forEach(o => pickVal.append(el('option', { value: o, textContent: o })));
              pickVal.value = list.find(o => o.toLowerCase() === cur.toLowerCase()) || cur;
              pickVal.style.display = ''; val.style.display = 'none';
            } else {
              pickVal.style.display = 'none'; val.style.display = needs ? '' : 'none';
              const dateVal = c && c.type === 'date' && ['before', 'after', 'eq'].includes(w.op);
              val.type = dateVal ? 'date' : c && (c.type === 'number' || c.type === 'date') ? 'number' : 'text';
              val.placeholder = c && c.type === 'date' && !dateVal ? 'days' : 'value';
            }
          };
          colSel.onchange = () => { w.col = colSel.value; fillOps(); };
          opSel.onchange = () => { w.op = opSel.value; fillOps(); };
          val.oninput = () => (w.value = val.value);
          pickVal.onchange = () => (w.value = pickVal.value);
          fillOps();
          card.append(el('div', { className: 'cond' }, el('span', { className: 'kw', textContent: wi === 0 ? 'when' : 'and' }), colSel, opSel, val, pickVal,
            el('button', { type: 'button', className: 'x', textContent: '✕', title: 'Remove condition', onclick: () => { rule.when.splice(wi, 1); draw(); } })));
        });
        card.append(el('div', { className: 'cond' }, el('span', { className: 'kw' }), el('button', { type: 'button', className: 'ghost', textContent: '+ Add condition', onclick: () => { rule.when.push({ col: cols[0] ? cols[0].key : '', op: '' }); draw(); } })));
        // effect
        const e = rule.effect;
        const apply = el('select');
        apply.append(el('option', { value: 'row', textContent: 'the whole row' }));
        cols.forEach(c => apply.append(el('option', { value: c.key, textContent: 'the "' + c.label + '" cell', selected: c.key === e.apply })));
        if (![...apply.options].some(o => o.value === e.apply)) e.apply = 'row';
        apply.value = e.apply;
        const label = el('input', { type: 'text', value: e.label || '', placeholder: 'badge text (optional)', style: 'width:150px' });
        label.oninput = () => (e.label = label.value);
        const sw = swatches(() => e.tone, t => (e.tone = t), { none: true });
        const done = el('input', { type: 'checkbox', checked: !!e.done });
        done.onchange = () => (e.done = done.checked);
        apply.onchange = () => { e.apply = apply.value; label.style.display = apply.value === 'row' ? 'none' : ''; };
        label.style.display = e.apply === 'row' ? 'none' : '';
        card.append(el('div', { className: 'eff' }, el('span', { className: 'kw', textContent: 'then' }), el('span', { textContent: 'colour' }), sw, apply, label,
          el('label', { title: 'Greys the row, strikes the first text column, and counts towards progress bars and done totals' }, done, 'counts as done')));
        box.append(card);
      });
      box.append(el('button', { type: 'button', className: 'ghost', textContent: '+ Add rule', onclick: () => { lvl.rules.push({ name: '', when: [{ col: colsOf()[0] ? colsOf()[0].key : '', op: '' }], effect: { apply: 'row', tone: '' } }); draw(); } }));
    };
    draw();
    return box;
  }

  const titleInputs = [];
  // Pages, grouped in the side list: the data set (one page per level, then its settings) and the project
  // (people, settings). Level pages are all built up front so their inputs exist when saving; one is shown at a time.
  const nav = el('div', { className: 'cfgnav' });
  const pane = el('div', { className: 'cfgpane' });
  const levelPages = [];
  const levelName = (lvl, i) => (titleInputs[i] && titleInputs[i].value.trim()) || lvl.title || (i ? 'Level ' + (i + 1) : 'Main records');
  let current = typeof start === 'string' ? start : 'level0';
  const navBtn = (id, label, sub) => {
    const b = el('button', { type: 'button', className: 'navitem' + (id === current ? ' active' : ''), onclick: () => { current = id; show(); } },
      el('span', { textContent: label }), ...(sub ? [el('small', { textContent: sub })] : []));
    b.dataset.id = id;
    return b;
  };
  const show = () => {
    nav.replaceChildren(el('div', { className: 'navlabel', textContent: 'Data set' }));
    draft.levels.forEach((lvl, i) => nav.append(navBtn('level' + i, levelName(lvl, i), (i ? 'Sub records · ' : 'Main records · ') + plural(lvl.columns.length, 'column'))));
    nav.append(el('button', { type: 'button', className: 'navitem addlvl', textContent: '+ Add a sub record level', onclick: () => {
      draft.levels.push({ title: '', columns: [{ key: '', label: 'Name', type: 'text' }] }); drawLevels(); current = 'level' + (draft.levels.length - 1); show();
    } }));
    nav.append(navBtn('dataset', 'Settings', 'Name · delete'),
      el('div', { className: 'navlabel', textContent: 'Project' }),
      navBtn('people', 'People', plural(draft.people.filter(p => p.name.trim()).length, 'person').replace(/persons$/, 'people')),
      navBtn('project', 'Settings', 'Name · delete'));
    pane.replaceChildren(...(current === 'dataset' ? datasetPage() : current === 'project' ? projectPage() : current === 'people' ? peoplePage() : levelPages[Number(current.slice(5))] || levelPages[0] || []));
    pane.scrollTop = 0;
  };
  const drawLevels = () => {
    levelPages.length = 0;
    titleInputs.length = 0;
    draft.levels.forEach((lvl, i) => {
      const t = el('input', { value: lvl.title || '', placeholder: i ? 'e.g. Item' : 'e.g. Task' });
      t.oninput = () => { const b = nav.querySelector('[data-id="level' + i + '"]'); if (b) b.firstChild.textContent = levelName(lvl, i); };
      titleInputs.push(t);
      const heading = i === 0 ? 'Main records' : 'Level ' + (i + 1) + ' sub records' + (i > 1 ? ' (nested inside level ' + i + ')' : '');
      const page = [...section(heading, lvl.columns, t)];
      const rules = el('details', { className: 'ruleswrap', open: (lvl.rules || []).length > 0 }, el('summary', { textContent: 'Rules · ' + (lvl.rules || []).length }), el('p', { className: 'sub', style: 'margin:6px 0 10px', textContent: 'Colour rows or cells, add a badge, or mark records as done when their values match.' }), rulesEditor(lvl));
      page.push(rules);
      if (i > 0 && i === draft.levels.length - 1) {
        page.push(el('button', { type: 'button', className: 'ghost', style: 'margin-top:14px', textContent: '− Remove this level', onclick: async () => {
          if (!await ask('Remove level ' + (i + 1) + '? All records at this level will be deleted when you save.', 'Remove', { danger: true })) return;
          draft.levels.pop(); drawLevels(); current = 'level' + (draft.levels.length - 1); show();
        } }));
      }
      levelPages.push(page);
    });
  };
  drawLevels();
  show();
  const cancel = el('button', { type: 'button', textContent: 'Cancel', onclick: () => dlg.close() });
  const ok = el('button', { className: 'primary', textContent: 'Save', type: 'submit' });
  form.append(header, el('div', { className: 'cfgbody' }, nav, pane), el('div', { className: 'dlgbtns cfgfoot' }, cancel, ok));
  form.onsubmit = () => {
    const finish = list => {
      const used = new Set();
      return list.filter(c => c.label.trim()).map(c => {
        let key = c.key || c.label.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'col';
        while (!c.key && (used.has(key) || ['id', 'parent_id', 'children'].includes(key))) key += '_';   // 'id' and friends belong to the record itself
        used.add(key);
        const out = { key, label: c.label.trim(), type: c.type };
        if (c.type === 'text') out.look = c.look || 'plain';
        if (c.type === 'date' && c.format && c.format !== 'native' && DATE_FORMATS[c.format]) out.format = c.format;
        if (c.type === 'choice') {
          out.options = [...new Set((c.options || []).map(o => o.trim()).filter(Boolean))];
          const colors = {}; out.options.forEach(o => { if (c.colors && TONES.includes(c.colors[o])) colors[o] = c.colors[o]; });
          if (Object.keys(colors).length) out.colors = colors;
          if (c.multi) out.multi = true;
        }
        if (c.type === 'lookup') { out.set = c.set || ''; if (c.multi) out.multi = true; if (Array.isArray(c.show) && c.show.length) out.show = c.show.slice(); }
        if (c.agg && aggOptions(out).includes(c.agg)) out.agg = c.agg;
        return out;
      });
    };
    const renames = new Map();
    const seenNames = new Set();
    const newPeople = draft.people.map(p => ({ name: p.name.trim(), email: (p.email || '').trim(), initials: (p.initials || '').trim().toUpperCase(), color: p.color, _was: p._was }))
      .filter(p => p.name && !seenNames.has(p.name.toLowerCase()) && seenNames.add(p.name.toLowerCase()))
      .map(p => {
        if (p._was && p._was !== p.name) renames.set(p._was, p.name);
        const out = { name: p.name };
        if (p.initials) out.initials = p.initials;
        if (TONES.includes(p.color)) out.color = p.color;
        return out;
      });
    const finishRules = (rules, cols) => (rules || []).map(r => ({
      name: (r.name || '').trim(),
      when: (r.when || []).filter(w => cols.some(c => c.key === w.col) && w.op).map(w => ({ col: w.col, op: w.op, ...(OP_NEEDS_VALUE.has(w.op) ? { value: w.value ?? '' } : {}) })),
      effect: { apply: r.effect && (r.effect.apply === 'row' || cols.some(c => c.key === r.effect.apply)) ? r.effect.apply : 'row', tone: r.effect && TONES.includes(r.effect.tone) ? r.effect.tone : '', label: (r.effect && r.effect.label || '').trim(), done: !!(r.effect && r.effect.done) },
    })).filter(r => r.when.length);
    const newLevels = draft.levels.map((lvl, i) => { const columns = finish(lvl.columns); return { title: titleInputs[i].value.trim() || (i ? 'Level ' + (i + 1) : 'Rows'), columns, rules: finishRules(lvl.rules, columns) }; })
      .filter((lvl, i) => i === 0 || lvl.columns.length);
    // Records deeper than the remaining levels are dropped.
    const prune = (rows, depth) => rows.forEach(r => { if (depth + 1 >= newLevels.length) delete r.children; else prune(r.children || [], depth + 1); });
    prune(state.rows, 0);
    if (renames.size) {   // a renamed person is renamed everywhere they are assigned
      const fix = v => Array.isArray(v) ? v.map(n => renames.get(n) || n) : (renames.get(v) || v);
      newLevels.forEach((lvl, d) => flattenLevel(state.rows, d).forEach(r => lvl.columns.forEach(c => { if (isPersonCol(c) && r[c.key] != null) r[c.key] = fix(r[c.key]); })));
    }
    state.config = { title: titleIn.value.trim() || 'Untitled', people: newPeople, levels: newLevels, views: state.config.views || [] };
    const projectName = projIn.value.trim();
    if (projectName && projectName !== state.projectName) { state.projectName = projectName; TT.renameProject(projectName); }
    undoReset();   // earlier versions of the rows belong to the old columns and people
    save(); render();
  };
  dlg.className = 'config';
  dlg.replaceChildren(closeX(() => dlg.close()), form);
  dlg.showModal();
}

TT.ready.then(() => fetch(TT.api('api/state'))).then(r => { if (!r.ok) throw new Error(); return r.json(); }).then(s => {
  state = s;
  levels().forEach(l => l.columns.forEach(c => { if (c.type === 'text' && c.look === 'person') { c.type = 'person'; delete c.look; } }));
  undoReset();
  const last = views().find(v => v.name === viewStore.get());   // the view that was open last time is opened again
  if (last) applyView(last); else render();
  if (location.hash === '#configure') { history.replaceState(null, '', location.pathname + location.search); openConfig(); }
}).catch(() => { setSaveStatus('error', 'Not connected'); document.getElementById('main').replaceChildren(el('div', { className: 'card empty' }, el('b', { textContent: 'Could not load your data' }), el('span', { textContent: 'Check that the server is running, then reload the page.' }))); });
</script>
</body>
</html>
